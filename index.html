    <script>
    const skills = [
      "Android, iOS and Symbian Dev",
      "PC Hardware and ICE Enthusiast",
      "3D Artist and Photographer/Videographer"
    ];

    let skillIndex = 0;
    let charIndex = 0;
    const typingElement = document.getElementById("typing");

    function typeEffect() {
      if (charIndex < skills[skillIndex].length) {
        typingElement.textContent += skills[skillIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeEffect, 75);
      } else {
        setTimeout(eraseEffect, 1500);
      }
    }

    function eraseEffect() {
      if (charIndex > 0) {
        typingElement.textContent = skills[skillIndex].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(eraseEffect, 27);
      } else {
        skillIndex = (skillIndex + 1) % skills.length;
        setTimeout(typeEffect, 300);
      }
    }

    document.addEventListener("DOMContentLoaded", typeEffect);
  </script>
